<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  
  <title>NFT preview card component</title>
  
  <link rel="stylesheet" href="style.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@..900&display=swap');
  </style>

</head>

<body>
  
  <div class="container">
    
    <div class="image-container">
      <img src="image-equilibrium.jpg" alt="" class="main-img"/>
      <div class="overlay">
        <img class="hover-icon" src="icon-view.svg" alt="" />
      </div>
      
    </div>
    
    <div class="text">
      <h2>Equilibrium #3429</h2>
      <p>Our Equilibrium collection promotes balance and calm.</p>
    </div>
    
    <div class="icons">
      
      <div class="icon1">
        <img class="" src="icon-ethereum.svg" alt="" />
        <span>0.041 ETH</span>
      </div>
      
      <div class="icon2">
        <img src="icon-clock.svg" alt="" />
        <span>3 days left</span>
      </div>
    </div>
    
    <div class="footer">
      <img src="image-avatar.png" alt="" />
      <span class="first">Creation of</span> 
      <span class="second">Jules Wyvern</span>
    </div>
    
  </div>

  

  

  
  
  
  
</body>
</html>
